[package]
name = "locaryn-plugin-desktop"
version = "0.1.0-beta.4"
edition = "2021"
description = "Official Locaryn Extension: contrôle de l'ordinateur (écran, souris, clavier, fenêtres, commandes) avec overlay plein écran et arrêt d'urgence"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-desktop-mcp"
path = "src/bin/desktop_mcp.rs"

[[bin]]
name = "locaryn-desktop-overlay"
path = "src/bin/desktop_overlay.rs"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
locaryn-morph-kit = { path = "vendor/morph-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["full"] }
uiautomation = "0.25"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
wry = "0.57"
xcap = "0.9"

[workspace]
